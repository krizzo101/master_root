apiVersion: v1
kind: Secret
metadata:
  name: sleuth-intel-secrets
  namespace: sleuth-intel
  labels:
    app: sleuth-intel
type: Opaque
stringData:
  # IMPORTANT: Replace these with actual base64-encoded values
  # Use: echo -n 'your-value' | base64
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"
  ENFORMION_API_KEY: "CHANGE_ME_IN_PRODUCTION"
  DATABASE_URL: "postgresql://user:password@postgres:5432/sleuth_intel"
  REDIS_URL: "redis://:password@redis:6379/0"
  SENTRY_DSN: "https://your-sentry-dsn@sentry.io/project-id"
