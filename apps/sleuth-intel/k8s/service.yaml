apiVersion: v1
kind: Service
metadata:
  name: sleuth-intel
  namespace: sleuth-intel
  labels:
    app: sleuth-intel
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: sleuth-intel
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: v1
kind: Service
metadata:
  name: sleuth-intel-internal
  namespace: sleuth-intel
  labels:
    app: sleuth-intel
spec:
  type: ClusterIP
  selector:
    app: sleuth-intel
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
