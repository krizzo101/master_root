apiVersion: v1
kind: ConfigMap
metadata:
  name: sleuth-intel-config
  namespace: sleuth-intel
  labels:
    app: sleuth-intel
data:
  # API Configuration
  API_RATE_LIMIT: "100/hour"
  API_TIMEOUT: "30"
  API_MAX_RETRIES: "3"

  # Enformion API
  ENFORMION_API_URL: "https://api.enformion.com/v2"
  ENFORMION_REQUEST_TIMEOUT: "60"
  ENFORMION_MAX_CONCURRENT_REQUESTS: "10"

  # Database
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "40"
  DATABASE_POOL_TIMEOUT: "30"

  # Redis
  REDIS_MAX_CONNECTIONS: "100"

  # Cache
  CACHE_DEFAULT_TIMEOUT: "300"

  # Logging
  LOG_LEVEL: "INFO"
  LOG_FILE: "/var/log/sleuth-intel/app.log"
  LOG_MAX_BYTES: "10485760"
  LOG_BACKUP_COUNT: "10"

  # Workers
  WORKER_PROCESSES: "4"
  WORKER_THREADS: "2"
  WORKER_MAX_REQUESTS: "1000"

  # Monitoring
  METRICS_PORT: "9090"

  # Feature Flags
  FEATURE_ASYNC_PROCESSING: "true"
  FEATURE_CACHING: "true"
  FEATURE_RATE_LIMITING: "true"
