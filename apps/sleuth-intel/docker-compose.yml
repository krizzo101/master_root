version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sleuth-intel:latest
    container_name: sleuth-intel-app
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      - ENV=production
    env_file:
      - .env.production
    volumes:
      - ./logs:/var/log/sleuth-intel
      - ./data:/var/lib/sleuth-intel
    depends_on:
      - postgres
      - redis
    networks:
      - sleuth-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: sleuth-intel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sleuth_intel
      POSTGRES_USER: ${DB_USER:-sleuth}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - sleuth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sleuth} -d sleuth_intel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sleuth-intel-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - sleuth-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: sleuth-intel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - app
    networks:
      - sleuth-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  sleuth-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
