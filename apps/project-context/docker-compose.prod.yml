version: '3.8'

services:
  # Project Context MCP Server
  project-context:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: project-context-server
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - timescaledb-init
    environment:
      # Database Configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-unified_context}
      - DB_USER=${DB_USER:-opsvi}
      - DB_PASSWORD=${DB_PASSWORD}

      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      # Application Configuration
      - INTEL_DIR=${INTEL_DIR:-/app/data/.proj-intel}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL=${CACHE_TTL:-300}
      - FILE_DATA_TTL=${FILE_DATA_TTL:-60}
      - PROJECT_STATS_TTL=${PROJECT_STATS_TTL:-300}
      - WATCH_ENABLED=${WATCH_ENABLED:-true}

      # Monitoring
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:-true}
      - PROMETHEUS_PORT=${PROMETHEUS_PORT:-8080}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # Security
      - API_KEY=${API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - MAX_REQUEST_SIZE=${MAX_REQUEST_SIZE:-10MB}
    volumes:
      - project-data:/app/data:rw
      - ./logs:/app/logs:rw
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${PROMETHEUS_PORT:-8080}:8080"
    networks:
      - project-context-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb:2.13-pg15
    container_name: project-context-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-unified_context}
      - POSTGRES_USER=${DB_USER:-opsvi}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS="--auth-host=scram-sha-256"
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/backups:/backups:rw
      - ./database/optimizations.sql:/opt/optimizations.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - project-context-network
    command: >
      postgres
      -c shared_preload_libraries='timescaledb,pg_stat_statements'
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c log_statement=mod
      -c log_min_duration_statement=1000
      -c logging_collector=on
      -c log_directory='/var/log/postgresql'
      -c log_filename='postgresql-%Y-%m-%d_%H%M%S.log'
      -c log_rotation_size=100MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-opsvi} -d ${DB_NAME:-unified_context}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # TimescaleDB initialization
  timescaledb-init:
    image: timescale/timescaledb:2.13-pg15
    container_name: project-context-timescale-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${DB_NAME:-unified_context}
      - PGUSER=${DB_USER:-opsvi}
      - PGPASSWORD=${DB_PASSWORD}
    volumes:
      - ./database/optimizations.sql:/opt/optimizations.sql:ro
    networks:
      - project-context-network
    command: >
      bash -c "
        echo 'Waiting for PostgreSQL to be ready...'
        until pg_isready -h postgres -p 5432 -U ${DB_USER:-opsvi}; do
          sleep 2
        done
        echo 'Applying database optimizations...'
        psql -f /opt/optimizations.sql
        echo 'Database initialization complete'
      "

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: project-context-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - project-context-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: project-context-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_WEB_PORT:-9090}:9090"
    networks:
      - project-context-network
    depends_on:
      - project-context
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:10.0.0
    container_name: project-context-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboard-configs:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - project-context-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: project-context-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx:rw
    ports:
      - "80:80"
      - "443:443"
    networks:
      - project-context-network
    depends_on:
      - project-context
      - grafana
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database Backup Service
  db-backup:
    image: postgres:15-alpine
    container_name: project-context-backup
    restart: "no"
    depends_on:
      - postgres
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${DB_NAME:-unified_context}
      - PGUSER=${DB_USER:-opsvi}
      - PGPASSWORD=${DB_PASSWORD}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./database/backups:/backups:rw
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    networks:
      - project-context-network
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    profiles:
      - backup

volumes:
  project-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  project-context-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
