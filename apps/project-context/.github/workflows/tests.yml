name: Unified Context System Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run performance tests nightly
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.7.1'

jobs:
  # Fast feedback - unit tests
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install -e .

    - name: Run unit tests
      run: |
        python scripts/run_tests.py --category unit --coverage

    - name: Upload unit test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: unit-test-results-${{ matrix.python-version }}
        path: test_reports/unit_*

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: test_reports/unit_coverage/coverage.xml
        flags: unit-tests
        name: codecov-unit

  # Database and schema tests
  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_context_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install -e .

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U test_user; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

    - name: Run database tests
      env:
        TEST_REAL_DB: true
        TEST_DB_URL: postgresql://test_user:test_password@localhost:5432/test_context_db
      run: |
        python scripts/run_tests.py --category database --coverage

    - name: Upload database test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: database-test-results
        path: test_reports/database_*

  # Integration tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install -e .

    - name: Run integration tests
      run: |
        python scripts/run_tests.py --category integration --coverage

    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: test_reports/integration_*

  # Adapter tests
  adapter-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        adapter: [git_adapter, error_adapter, cicd_adapter]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install -e .

    - name: Run ${{ matrix.adapter }} tests
      run: |
        python -m pytest tests/ -m ${{ matrix.adapter }} --timeout=600 --junit-xml=test_reports/${{ matrix.adapter }}_results.xml --html=test_reports/${{ matrix.adapter }}_report.html --self-contained-html -v

    - name: Upload adapter test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: ${{ matrix.adapter }}-test-results
        path: test_reports/${{ matrix.adapter }}_*

  # End-to-end tests
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [integration-tests, adapter-tests]
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_context_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install -e .

    - name: Run e2e tests
      env:
        TEST_REAL_DB: true
        TEST_DB_URL: postgresql://test_user:test_password@localhost:5432/test_context_db
      run: |
        python scripts/run_tests.py --category e2e

    - name: Upload e2e test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-results
        path: test_reports/e2e_*

  # Performance tests (only on schedule or manual trigger)
  performance-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install -e .
        # Install performance monitoring tools
        pip install psutil memory-profiler

    - name: Run performance tests
      run: |
        python scripts/run_tests.py --category performance

    - name: Upload performance test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results
        path: test_reports/performance_*

    - name: Performance regression check
      run: |
        # Compare with baseline performance metrics
        python scripts/check_performance_regression.py || echo "Performance check completed with warnings"

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy bandit safety

    - name: Code formatting check
      run: |
        black --check src/ tests/
        isort --check-only src/ tests/

    - name: Linting
      run: |
        flake8 src/ tests/

    - name: Type checking
      run: |
        mypy src/ || echo "Type checking completed with warnings"

    - name: Security scan
      run: |
        bandit -r src/
        safety check

    - name: Upload code quality results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: code-quality-results
        path: |
          .mypy_cache/
          bandit-report.txt
          safety-report.txt

  # Combine results and report
  test-summary:
    runs-on: ubuntu-latest
    needs: [unit-tests, database-tests, integration-tests, adapter-tests, e2e-tests]
    if: always()

    steps:
    - uses: actions/checkout@v4

    - name: Download all test artifacts
      uses: actions/download-artifact@v3
      with:
        path: all_test_results

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Generate combined test report
      run: |
        python scripts/generate_test_summary.py all_test_results/ combined_test_report.html

    - name: Upload combined test report
      uses: actions/upload-artifact@v3
      with:
        name: combined-test-report
        path: combined_test_report.html

    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = 'combined_test_report.html';

          if (fs.existsSync(path)) {
            const report = fs.readFileSync(path, 'utf8');
            // Extract summary from HTML and post as comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🧪 Test Results Summary\n\nDetailed results available in the test artifacts.'
            });
          }

# Workflow for manual test execution
workflow_dispatch:
  inputs:
    test_category:
      description: 'Test category to run'
      required: false
      default: 'all'
      type: choice
      options:
        - all
        - unit
        - integration
        - e2e
        - performance
        - database
        - adapters
    include_performance:
      description: 'Include performance tests'
      required: false
      default: false
      type: boolean
    verbose:
      description: 'Verbose output'
      required: false
      default: false
      type: boolean
