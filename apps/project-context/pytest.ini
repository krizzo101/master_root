[tool:pytest]
# Pytest configuration for unified context system

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output and verbosity
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --durations=10
    --color=yes
    --maxfail=5
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (moderate speed, some dependencies)
    e2e: End-to-end tests (slow, full system)
    performance: Performance and load tests (slow, resource intensive)
    stress: Stress tests (very slow, high resource usage)
    slow: Slow running tests (>30 seconds)
    database: Tests requiring database
    schema: Database schema validation tests
    real_db: Tests requiring real database connection
    network: Tests requiring network access
    git_adapter: Git adapter specific tests
    error_adapter: Error adapter specific tests
    cicd_adapter: CI/CD adapter specific tests
    adapter_correlation: Cross-adapter correlation tests
    pipeline: Pipeline integration tests

# Async test configuration
asyncio_mode = auto

# Coverage configuration
addopts = --cov=src/project_context --cov-report=html --cov-report=term-missing --cov-fail-under=80

# Test filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:aiohttp.*
    ignore::UserWarning:asyncpg.*

# Timeout configuration
timeout = 300
timeout_method = thread

# Logging during tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# JUnit XML output for CI/CD
junit_family = xunit2
junit_logging = all
