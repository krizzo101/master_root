version: "3.8"
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.7.3
    ports:
      - "6335:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=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
      - PERPLEXITY_API_KEY=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
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
volumes:
  redis_data:
  qdrant_data:
