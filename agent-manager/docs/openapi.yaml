openapi: 3.0.3
info:
  title: Agent Manager API
  description: REST API for managing software agents
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /api/auth/signup:
    post:
      summary: Create new user account
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        201:
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                  token:
                    type: string
        400:
          description: Invalid input
        409:
          description: Email already exists

  /api/auth/login:
    post:
      summary: Login user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                  token:
                    type: string
        401:
          description: Invalid credentials

  /api/agents:
    get:
      summary: List all agents
      tags: [Agents]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [stopped, running, failed]
        - name: type
          in: query
          schema:
            type: string
            enum: [chatbot, runner, custom]
      responses:
        200:
          description: List of agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agent'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        401:
          description: Unauthorized

    post:
      summary: Create new agent
      tags: [Agents]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                description:
                  type: string
                type:
                  type: string
                  enum: [chatbot, runner, custom]
                config:
                  type: object
      responses:
        201:
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        400:
          description: Invalid input
        401:
          description: Unauthorized

  /api/agents/{id}:
    get:
      summary: Get agent by ID
      tags: [Agents]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Agent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        401:
          description: Unauthorized
        404:
          description: Agent not found

    patch:
      summary: Update agent
      tags: [Agents]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                config:
                  type: object
      responses:
        200:
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        400:
          description: Invalid input
        401:
          description: Unauthorized
        404:
          description: Agent not found

    delete:
      summary: Delete agent (soft delete)
      tags: [Agents]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Agent deleted
        401:
          description: Unauthorized
        404:
          description: Agent not found

  /api/agents/{id}/run:
    post:
      summary: Start agent run
      tags: [Agent Runs]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                params:
                  type: object
      responses:
        202:
          description: Run started
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                    format: uuid
                  agentId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [starting]
        401:
          description: Unauthorized
        404:
          description: Agent not found
        409:
          description: Agent already running

  /api/agents/{id}/stop:
    post:
      summary: Stop agent run
      tags: [Agent Runs]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Stop signal sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        401:
          description: Unauthorized
        404:
          description: Agent not found
        409:
          description: Agent not running

  /api/agents/{id}/runs:
    get:
      summary: List agent runs
      tags: [Agent Runs]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: List of runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentRun'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        401:
          description: Unauthorized
        404:
          description: Agent not found

  /api/agents/{id}/runs/{runId}/logs:
    get:
      summary: Get run logs
      tags: [Agent Runs]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tail
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        200:
          description: Run logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: string
                  offset:
                    type: integer
        401:
          description: Unauthorized
        404:
          description: Run not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [chatbot, runner, custom]
        config:
          type: object
        status:
          type: string
          enum: [stopped, running, failed]
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        status:
          type: string
          enum: [starting, running, stopped, failed, completed]
        logs:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
