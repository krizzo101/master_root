name: Project Reorganization Workflow
description: Refactoring, modernization, and reorganization of existing projects
version: "1.0"

team_structure:
  analysis_team:
    - role: code-analyzer
      lead: true
      responsibilities:
        - Codebase assessment
        - Technical debt identification
        - Dependency analysis
        - Complexity metrics

    - role: reviewer-critic
      responsibilities:
        - Code quality review
        - Anti-pattern detection
        - Best practices gap analysis

    - role: performance-optimizer
      responsibilities:
        - Performance bottleneck identification
        - Resource usage analysis
        - Optimization opportunities

  planning_team:
    - role: refactoring-master
      lead: true
      responsibilities:
        - Refactoring strategy
        - Migration planning
        - Risk assessment

    - role: solution-architect
      responsibilities:
        - Target architecture design
        - Technology migration path
        - Integration planning

  execution_team:
    - role: refactoring-master
      instances: 2
      responsibilities:
        - Code refactoring
        - Pattern implementation
        - Module extraction

    - role: development-specialist
      instances: 2
      responsibilities:
        - New feature implementation
        - Code modernization
        - Test creation

    - role: qa-testing-guru
      responsibilities:
        - Regression testing
        - Test coverage improvement
        - Quality assurance

workflow:
  phases:
    - name: Assessment
      duration: "2-3 days"
      parallel_groups:
        - [code-analyzer, reviewer-critic, performance-optimizer]
      tasks:
        - Analyze existing codebase structure
        - Identify technical debt
        - Measure code complexity
        - Document anti-patterns
        - Assess test coverage
        - Review dependencies
      deliverables:
        - assessment/code_analysis_report.md
        - assessment/technical_debt_inventory.md
        - assessment/performance_baseline.md
        - assessment/dependency_graph.md
      gates:
        - Complete codebase scanned
        - All metrics collected
        - Risks documented

    - name: Planning
      duration: "1-2 days"
      parallel_groups:
        - [refactoring-master, solution-architect]
      tasks:
        - Define target architecture
        - Create refactoring plan
        - Prioritize improvements
        - Plan migration phases
        - Estimate effort
      deliverables:
        - planning/refactoring_strategy.md
        - planning/target_architecture.md
        - planning/migration_roadmap.md
        - planning/risk_mitigation.md
      gates:
        - Strategy approved
        - Priorities set
        - Resources allocated

    - name: Preparation
      duration: "1 day"
      parallel_groups:
        - [qa-testing-guru, development-specialist]
      tasks:
        - Create safety net of tests
        - Set up CI/CD pipeline
        - Configure monitoring
        - Create rollback procedures
      deliverables:
        - preparation/test_suite/
        - preparation/ci_cd_config.yaml
        - preparation/monitoring_setup.md
        - preparation/rollback_plan.md
      gates:
        - Test coverage >80%
        - CI/CD operational
        - Rollback tested

    - name: Refactoring
      duration: "5-10 days"
      parallel_groups:
        - [refactoring-master-1, refactoring-master-2]
        - [development-specialist-1, development-specialist-2]
      tasks:
        - Extract modules
        - Eliminate duplications
        - Simplify complex methods
        - Update dependencies
        - Improve naming
        - Add documentation
      deliverables:
        - refactored_code/
        - refactoring/change_log.md
        - refactoring/pattern_applications.md
      gates:
        - All tests passing
        - No regression detected
        - Code quality improved

    - name: Modernization
      duration: "3-5 days"
      parallel_groups:
        - [development-specialist, solution-architect]
      tasks:
        - Migrate to modern frameworks
        - Update language features
        - Implement new patterns
        - Add type safety
        - Improve error handling
      deliverables:
        - modernized_code/
        - modernization/migration_report.md
        - modernization/compatibility_matrix.md
      gates:
        - Framework migration complete
        - Compatibility verified
        - Performance validated

    - name: Validation
      duration: "2 days"
      parallel_groups:
        - [qa-testing-guru, performance-optimizer, code-analyzer]
      tasks:
        - Run comprehensive tests
        - Performance comparison
        - Security scan
        - Code quality metrics
      deliverables:
        - validation/test_report.md
        - validation/performance_comparison.md
        - validation/security_report.md
        - validation/quality_metrics.md
      gates:
        - All tests green
        - Performance maintained/improved
        - Security issues resolved

# Refactoring patterns
refactoring_patterns:
  code_smells:
    - name: Long Method
      solution: Extract Method
      agents: [refactoring-master]

    - name: Large Class
      solution: Extract Class/Interface
      agents: [refactoring-master]

    - name: Duplicate Code
      solution: Extract Method/Pull Up Method
      agents: [refactoring-master]

    - name: Feature Envy
      solution: Move Method/Move Field
      agents: [refactoring-master]

  architectural_smells:
    - name: God Object
      solution: Split into multiple services
      agents: [solution-architect, refactoring-master]

    - name: Cyclic Dependencies
      solution: Dependency Inversion
      agents: [solution-architect]

    - name: Scattered Functionality
      solution: Consolidate into modules
      agents: [refactoring-master]

# Modernization strategies
modernization:
  strategies:
    - name: Lift and Shift
      when: "Quick migration needed"
      risk: low
      effort: low

    - name: Re-platform
      when: "Platform change required"
      risk: medium
      effort: medium

    - name: Re-architect
      when: "Major improvements needed"
      risk: high
      effort: high

    - name: Rebuild
      when: "Complete overhaul required"
      risk: high
      effort: very_high

# Quality gates
quality_gates:
  mandatory:
    - test_coverage: ">80%"
    - code_complexity: "<10 per method"
    - duplication: "<5%"
    - security_vulnerabilities: 0

  recommended:
    - documentation_coverage: ">70%"
    - type_coverage: ">90%"
    - performance_regression: "<10%"

# Risk management
risks:
  - risk: Breaking changes
    mitigation: Comprehensive test coverage
    owner: qa-testing-guru

  - risk: Performance degradation
    mitigation: Continuous performance testing
    owner: performance-optimizer

  - risk: Data loss
    mitigation: Backup and rollback procedures
    owner: devops-automation
