version: '3.8'

services:
  neo4j:
    image: neo4j:5.23-community
    container_name: unified_context_neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
      # Memory settings for development
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins
      - ./init-scripts/neo4j:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - context_network

volumes:
  neo4j_data:
    name: unified_context_neo4j_data
  neo4j_logs:
    name: unified_context_neo4j_logs
  neo4j_import:
    name: unified_context_neo4j_import
  neo4j_plugins:
    name: unified_context_neo4j_plugins

networks:
  context_network:
    name: unified_context_network
    driver: bridge
