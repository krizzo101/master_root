name: Application Development Workflow
description: Complete application development lifecycle with specialized agent teams
version: "1.0"

# Team composition and roles
team_structure:
  leadership:
    - role: ceo-team-manager
      responsibilities:
        - Overall project coordination
        - Resource allocation
        - Timeline management
        - Stakeholder communication

  discovery_team:
    - role: requirements-analyst
      responsibilities:
        - Gather functional requirements
        - Document user stories
        - Define acceptance criteria
    - role: research-genius
      responsibilities:
        - Technology research
        - Competitive analysis
        - Best practices identification
    - role: business-analyst
      responsibilities:
        - Business logic definition
        - ROI analysis
        - Process mapping

  design_team:
    - role: solution-architect
      responsibilities:
        - System architecture design
        - Technology stack selection
        - Integration planning
    - role: database-specialist
      responsibilities:
        - Data model design
        - Database optimization
        - Migration strategies
    - role: api-integration-specialist
      responsibilities:
        - API contract design
        - Service integration
        - Third-party API research

  development_team:
    - role: development-specialist
      instances: 3  # Can spawn multiple for parallel development
      responsibilities:
        - Core feature implementation
        - Code review participation
        - Unit test creation
    - role: frontend-developer
      responsibilities:
        - UI/UX implementation
        - Component development
        - State management

  quality_team:
    - role: qa-testing-guru
      responsibilities:
        - Test strategy development
        - Test automation
        - Quality metrics
    - role: security-architect
      responsibilities:
        - Security assessment
        - Vulnerability testing
        - Security hardening
    - role: performance-optimizer
      responsibilities:
        - Performance profiling
        - Optimization implementation
        - Load testing

  deployment_team:
    - role: devops-automation
      responsibilities:
        - CI/CD pipeline setup
        - Infrastructure as code
        - Monitoring setup
    - role: technical-writer
      responsibilities:
        - Documentation creation
        - API documentation
        - User guides

# Workflow phases with parallel execution groups
workflow:
  phases:
    - name: Discovery
      duration: "2-3 days"
      parallel_groups:
        - [requirements-analyst, research-genius, business-analyst]
      deliverables:
        - requirements.md
        - research_report.md
        - business_case.md
      gates:
        - All requirements documented
        - Technology stack approved
        - Business case validated

    - name: Design
      duration: "3-4 days"
      parallel_groups:
        - [solution-architect, database-specialist, api-integration-specialist]
      deliverables:
        - architecture.md
        - database_schema.sql
        - api_specification.yaml
      gates:
        - Architecture reviewed
        - Database design approved
        - API contracts finalized

    - name: Planning
      duration: "1-2 days"
      parallel_groups:
        - [ceo-team-manager, solution-architect]
      deliverables:
        - project_plan.md
        - sprint_backlog.md
        - resource_allocation.md
      gates:
        - Tasks estimated
        - Resources allocated
        - Timeline approved

    - name: Development
      duration: "10-15 days"
      parallel_groups:
        - [development-specialist-1, development-specialist-2, development-specialist-3]
        - [frontend-developer, database-specialist]
      deliverables:
        - source_code/
        - unit_tests/
        - integration_tests/
      gates:
        - All features implemented
        - Code reviews completed
        - Unit tests passing

    - name: Testing
      duration: "3-5 days"
      parallel_groups:
        - [qa-testing-guru, security-architect, performance-optimizer]
      deliverables:
        - test_reports/
        - security_report.md
        - performance_metrics.md
      gates:
        - All tests passing
        - Security vulnerabilities addressed
        - Performance targets met

    - name: Deployment
      duration: "1-2 days"
      parallel_groups:
        - [devops-automation, technical-writer]
      deliverables:
        - deployment_scripts/
        - documentation/
        - monitoring_config/
      gates:
        - Deployment successful
        - Monitoring active
        - Documentation complete

# Token allocation strategy
token_strategy:
  max_parallel_agents: 6
  allocation_method: "round-robin"
  priority_roles:
    - ceo-team-manager  # Always gets token 1
    - solution-architect  # Always gets token 2

# Communication channels
communication:
  - type: shared_workspace
    path: "/tmp/agent_teams/{project_name}"
  - type: status_updates
    frequency: "after_each_phase"
  - type: gate_reviews
    participants: [ceo-team-manager, solution-architect]

# Error handling
error_handling:
  retry_strategy:
    max_retries: 3
    backoff: exponential
  fallback_agents:
    requirements-analyst: business-analyst
    development-specialist: solution-architect
    qa-testing-guru: security-architect

# Success metrics
metrics:
  - name: velocity
    measure: "features_per_sprint"
    target: 10
  - name: quality
    measure: "defect_rate"
    target: "<5%"
  - name: efficiency
    measure: "parallel_execution_rate"
    target: ">80%"
